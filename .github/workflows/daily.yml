name: 일별 ETF 구성종목 수집

on:
  schedule:
    # 07:00 KST = 22:00 UTC 전날. KST 월~금에 돌리려면 UTC 일~목.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 며칠까지 소급 수집할지 (영업일 기준)"
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 수동 실행일 때만 KRX 접근 상태를 진단한다. 실패해도 그냥 넘어간다.
      - name: KRX 접근 진단
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/diag.py

      - name: 구성종목 수집
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록하면 사용됩니다.
          # 없으면 비로그인으로 시도합니다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          BACKFILL: ${{ github.event.inputs.backfill || '5' }}
        run: python scripts/collect.py --backfill "$BACKFILL"

      - name: 대시보드 생성
        run: python scripts/render.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data docs; do
            if [ -e "$p" ]; then git add "$p"; else echo "없음: $p"; fi
          done
          if git diff --staged --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
